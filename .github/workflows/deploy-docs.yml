name: Deploy Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish the data.jsonl release and deploy to Pages.
permissions:
  contents: write
  pages: write
  id-token: write

# Only one Pages deployment at a time; cancel in-progress runs on new pushes.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # GitHub project site base path: "/<repo>/". Used by both the site
      # generator (raw-HTML links) and the VitePress build (asset/base URLs).
      DOCS_BASE: /${{ github.event.repository.name }}/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 1. Build the corpus artifact consumed by vtk-ontology.
      - name: Build data.jsonl
        run: python scripts/data/generate_data.py --write --all

      # 2. Publish data.jsonl as a rolling GitHub release asset so vtk-ontology
      #    can consume it. (Only on pushes to main, not on manual dry runs.)
      - name: Publish data.jsonl release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: data-latest
          name: data-latest
          files: data/data.jsonl

      # NOTE: The fetch step (scripts.artifacts.fetch_artifacts) is intentionally
      # skipped while vtk-ontology is not yet on GitHub. We use the committed
      # vendor/experiments.jsonl instead. Re-enable fetch once the upstream
      # release exists and artifacts.lock.json points at its URL.
      - name: Generate site pages
        run: python -m scripts.web.generate_site

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install docs dependencies
        working-directory: docs
        run: npm ci

      - name: Build site
        working-directory: docs
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: npm run docs:build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
